site_name: 钡铼技术资料库
site_description: Official documentation for ARMxy industrial edge gateways
site_url: https://beilai-technology.github.io/Bliiot-Documentation-Library/

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            教程案例: Tutorials
            Node-RED: Node-RED
            硬件产品: Hardware Products
            ARMxy 边缘网关: ARMxy Edge Gateways
            BL335 说明书: BL335 Specification
            BL335 使用说明书: BL335 User Manual
            EdgePLC 边缘控制器: EdgePLC Controllers
            BL245 规格书: BL245 Specification
            BL245 使用说明书: BL245 User Manual
            软件产品: Software Products
            软件产品总览: Software Overview

# 主题：material 工业文档美观主题，外网展示效果好
theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/钡铼技术英文logo.png
  favicon: assets/images/钡铼技术英文logo.png
  palette:
    # 亮色模式下代码块自动深色
    - scheme: default
      primary: light-blue
      accent: blue
      
# 导航栏目录，完全匹配仓库 docs 实际文件层级
nav:
  - 首页: index.md
  - 教程案例:
      - Node-RED: 教程案例/Node-red.md
  - 硬件产品:
      - ARMxy 边缘网关:
          - BL335 说明书: 硬件产品/ARMxy/规格书/BL335规格书.md
          - BL335 使用说明书: 硬件产品/ARMxy/说明书/BL335说明书.md
      - EdgePLC 边缘控制器:
          - BL245 规格书: 硬件产品/EdgePLC/规格书/BL245规格书.md
          - BL245 使用说明书: 硬件产品/EdgePLC/说明书/BL245使用说明书.md
  - 软件产品:
      - Codesys: 软件/Codesys.md

extra_css:
  - assets/custom.css
